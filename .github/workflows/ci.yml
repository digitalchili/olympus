name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --include=dev
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:shell
      - run: npm run build
      - run: HERMES_DATA_VOLUME=ci-hermes docker compose config --quiet
      - run: HERMES_DATA_VOLUME=ci-hermes docker compose -f docker-compose.ha.yml config --quiet
      - run: docker build -t olympus-dispatch:test .

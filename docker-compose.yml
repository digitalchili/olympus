services:
  olympus-dispatch:
    image: ${OLYMPUS_DISPATCH_IMAGE:-ghcr.io/digitalchili/olympus:0.3.0}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "6969"
      OLYMPUS_STRICT_PORT: "1"
      HOME: /opt/data/home
      HERMES_HOME: /opt/data
      HERMES_AGENT_DIR: /opt/hermes
      HERMES_PYTHON: /opt/hermes/.venv/bin/python
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_WRITE_SAFE_ROOT: /opt/data
      OLYMPUS_DISPATCH_HOME: /opt/data/olympus-dispatch
      DB_PATH: /opt/data/olympus-dispatch/data/olympus-dispatch.db
      OLYMPUS_DISPATCH_PROJECT_ROOT: /opt/data/olympus-dispatch/workspace
    ports:
      - "${OLYMPUS_DISPATCH_BIND_ADDRESS:-127.0.0.1}:${OLYMPUS_DISPATCH_PORT:-6969}:6969"
    volumes:
      - olympus_dispatch_state:/opt/data/olympus-dispatch
      - hermes_data:/opt/data
    user: "10000:10000"
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=256m,mode=1777"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 150s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:6969/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 6

volumes:
  olympus_dispatch_state:
    name: ${OLYMPUS_DISPATCH_STATE_VOLUME:-olympus-dispatch-state}
  hermes_data:
    name: ${HERMES_DATA_VOLUME:-hermes-data}
